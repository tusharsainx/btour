name: btour
description: "Bihar Tourism Experiences Marketplace - Discover, book, and experience the heritage of Bihar"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter

  # UI & Icons
  cupertino_icons: ^1.0.8
  flutter_svg: ^2.0.10+1
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0
  flutter_staggered_grid_view: ^0.7.0
  smooth_page_indicator: ^2.0.1
  flutter_rating_bar: ^4.0.1
  lottie: ^3.1.0
  
  # State Management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5
  
  # Navigation
  go_router: ^17.0.1
  
  # Firebase
  firebase_core: ^4.4.0
  firebase_auth: ^6.1.4
  cloud_firestore: ^6.1.2
  firebase_storage: ^13.0.6
  firebase_messaging: ^16.1.1
  firebase_analytics: ^12.1.1
  
  # Authentication
  google_sign_in: ^7.2.0
  
  # Maps & Location
  google_maps_flutter: ^2.6.1
  geolocator: ^14.0.2
  geocoding: ^4.0.0
  
  # Payment
  razorpay_flutter: ^1.4.0
  
  # Local Storage
  shared_preferences: ^2.2.3
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  
  # Network
  dio: ^5.4.3+1
  connectivity_plus: ^7.0.0
  
  # Utils
  intl: ^0.20.2
  uuid: ^4.4.0
  image_picker: ^1.1.1
  url_launcher: ^6.2.6
  share_plus: ^12.0.1
  flutter_local_notifications: ^20.0.0
  permission_handler: ^12.0.1
  
  # Animation
  animate_do: ^4.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  riverpod_generator: ^2.4.0
  build_runner: ^2.4.9
  hive_generator: ^2.0.1
  json_serializable: ^6.8.0


  
flutter:
  uses-material-design: true
  
  assets:
    - assets/images/
    - assets/icons/
    - assets/animations/
    
  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Light.ttf
          weight: 300
        - asset: assets/fonts/Poppins-Regular.ttf
          weight: 400
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
    - family: Playfair
      fonts:
        - asset: assets/fonts/PlayfairDisplay-Regular.ttf
          weight: 400
        - asset: assets/fonts/PlayfairDisplay-Bold.ttf
          weight: 700


dependency_overrides:
  fluttertoast: ^9.0.0
